[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nplg-dspace-mcp"
version = "0.1.0"
description = "Upstream-read-only MCP server for NPLG Iverieli DSpace"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "David Osipov" }]
dependencies = [
  "fastapi==0.133.0",
  "starlette==1.3.1",
  "click==8.3.3",
  "uvicorn==0.48.0",
  "pydantic==2.13.4",
  "httpx==0.28.1",
  "beautifulsoup4==4.14.3",
  "lxml==6.1.1",
  "defusedxml==0.7.1",
  "pypdfium2==5.8.0",
  "Pillow==12.3.0",
  "prometheus-client==0.25.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "jsonschema==4.26.0",
  "PyYAML==6.0.3",
  "pypdf==5.9.0",
  "reportlab==4.4.9",
]

[project.scripts]
nplg-dspace-mcp = "nplg_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "live: requires network access to the live NPLG repository",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["nplg_mcp"]

[tool.coverage.report]
show_missing = true
fail_under = 80
