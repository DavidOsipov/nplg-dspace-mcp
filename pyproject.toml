[build-system]
requires = ["setuptools==84.0.0", "wheel==0.48.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nplg-dspace-mcp"
version = "0.1.0"
description = "Upstream-read-only MCP server for NPLG Iverieli DSpace"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "David Osipov" }]
dependencies = [
  "fastapi==0.133.0",
  "starlette==1.3.1",
  "click==8.3.3",
  "uvicorn==0.48.0",
  "pydantic==2.13.4",
  "httpcore==1.0.9",
  "httpcore2==2.9.0",
  "httpx==0.28.1",
  "httpx2==2.9.0",
  "jsonschema==4.26.0",
  "mcp==2.0.0",
  "mcp-types==2.0.0",
  "opentelemetry-api==1.44.0",
  "PyJWT[crypto]==2.13.0",
  "python-multipart==0.0.32",
  "pywin32==311 ; sys_platform == 'win32'",
  "sse-starlette==3.4.8",
  "truststore==0.10.4",
  "beautifulsoup4==4.14.3",
  "lxml==6.1.1",
  "defusedxml==0.7.1",
  "pypdfium2==5.8.0",
  "Pillow==12.3.0",
  "prometheus-client==0.26.0",
]

[project.optional-dependencies]
test = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "pytest-cov==7.1.0",
  "coverage==7.15.4",
  "hypothesis==6.165.9",
  "PyYAML==6.0.3",
  "pypdf==6.16.1",
  "reportlab==4.4.9",
]

[project.scripts]
nplg-dspace-mcp = "nplg_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "live: requires network access to the live NPLG repository",
  "staging: requires explicit access to a reviewed staging deployment",
  "container: requires an authorized isolated container runtime",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
parallel = true
patch = ["subprocess"]
source = ["nplg_mcp", "scripts"]

[tool.coverage.report]
show_missing = true
fail_under = 95

[tool.ruff]
target-version = "py312"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
  "COM812",
  "COM819",
  "D203",
  "D213",
  "D206",
  "D300",
  "E111",
  "E114",
  "E117",
  "Q000",
  "Q001",
  "Q002",
  "Q003",
  "Q004",
  "W191",
]

[tool.ruff.lint.flake8-copyright]
notice-rgx = "Copyright \\(c\\) 2026 David Osipov"
min-file-size = 0

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D102", "D103", "S101"]

[tool.mypy]
python_version = "3.12"
strict = true
extra_checks = true
strict_equality_for_none = true
strict_bytes = true
warn_unreachable = true
warn_unused_configs = true
incremental = false
disallow_any_generics = true
disallow_any_explicit = true
disallow_any_unimported = true
disallow_any_decorated = true
disallow_any_expr = true
mypy_path = "typings:src"
plugins = ["pydantic.mypy"]
enable_error_code = [
  "comparison-overlap",
  "deprecated",
  "exhaustive-match",
  "explicit-any",
  "explicit-override",
  "ignore-without-code",
  "mutable-override",
  "no-any-return",
  "no-any-unimported",
  "no-untyped-call",
  "no-untyped-def",
  "possibly-undefined",
  "redundant-cast",
  "redundant-expr",
  "redundant-self",
  "truthy-bool",
  "truthy-iterable",
  "type-arg",
  "unimported-reveal",
  "unreachable",
  "untyped-decorator",
  "unused-awaitable",
  "unused-ignore",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
