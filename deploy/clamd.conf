# Local-only ClamAV daemon for the private-full scanner container.
LocalSocket /run/nplg-scanner/clamd.sock
LocalSocketMode 600
Foreground true
DatabaseDirectory /var/lib/clamav
TemporaryDirectory /tmp
MaxThreads 1
ReadTimeout 30
CommandReadTimeout 5
SendBufTimeout 30
MaxQueue 1
StreamMaxLength 536870912
MaxScanSize 536870912
MaxFileSize 536870912
MaxRecursion 16
MaxFiles 1000
MaxEmbeddedPE 10485760
MaxHTMLNormalize 10485760
MaxScriptNormalize 10485760
MaxZipTypeRcg 1048576
DetectPUA false
AlertEncryptedArchive true
AlertEncryptedDoc true
