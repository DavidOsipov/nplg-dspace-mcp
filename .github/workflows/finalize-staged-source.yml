name: Finalize staged source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-staged-source.yml'

permissions:
  contents: write

concurrency:
  group: nplg-finalize-staged-source
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Recover source tree when main is still staged
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$GITHUB_SHA" > /tmp/expected-main-sha

          if [ -f pyproject.toml ] && [ -f alpic.json ] && [ -f src/nplg_mcp/app.py ]; then
            echo 'Complete source tree is already present; recovery extraction is not needed.'
            exit 0
          fi

          mapfile -t PARTS < <(find . -type f -name 'part-*.b64' -print | sort -V)
          if [ "${#PARTS[@]}" -eq 0 ]; then
            echo 'No complete source tree and no staged part-*.b64 payload were found.' >&2
            exit 1
          fi

          : > /tmp/source-payload
          for part in "${PARTS[@]}"; do
            tr -d '\r\n' < "$part" | base64 --decode >> /tmp/source-payload
          done

          rm -rf /tmp/source-unpacked
          mkdir -p /tmp/source-unpacked
          python3 - <<'PY'
          from __future__ import annotations

          import subprocess
          import tarfile
          import zipfile
          from pathlib import Path

          payload = Path('/tmp/source-payload')
          destination = Path('/tmp/source-unpacked').resolve()

          def safe_target(name: str) -> Path:
              target = (destination / name).resolve()
              if target != destination and destination not in target.parents:
                  raise RuntimeError(f'Archive path escapes destination: {name!r}')
              return target

          if zipfile.is_zipfile(payload):
              with zipfile.ZipFile(payload) as archive:
                  for member in archive.infolist():
                      safe_target(member.filename)
                  archive.extractall(destination)
          elif tarfile.is_tarfile(payload):
              with tarfile.open(payload, mode='r:*') as archive:
                  for member in archive.getmembers():
                      safe_target(member.name)
                      if member.issym() or member.islnk():
                          raise RuntimeError(f'Links are not permitted: {member.name!r}')
                  archive.extractall(destination, filter='data')
          else:
              verification = subprocess.run(
                  ['git', 'bundle', 'verify', str(payload)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if verification.returncode != 0:
                  raise RuntimeError('Payload is neither ZIP, TAR, nor a valid Git bundle')
              subprocess.run(
                  ['git', 'clone', str(payload), str(destination / 'bundle-repository')],
                  check=True,
              )

          candidates = [
              path for path in sorted(destination.rglob('pyproject.toml'))
              if '.git' not in path.parts
          ]
          if len(candidates) != 1:
              raise RuntimeError(f'Expected exactly one pyproject.toml, found {len(candidates)}')
          root = candidates[0].parent
          for required in ('alpic.json', 'requirements.lock', 'src/nplg_mcp/app.py'):
              if not (root / required).is_file():
                  raise RuntimeError(f'Missing required source file: {required}')
          Path('/tmp/source-root').write_text(str(root), encoding='utf-8')
          PY

          SOURCE_ROOT="$(cat /tmp/source-root)"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$SOURCE_ROOT"/. .

      - name: Remove transport-only artifacts and validate root
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .bootstrap .upload
          rm -f \
            .github/workflows/publish-staged-source.yml \
            .github/workflows/verify-alpic-source.yml \
            .github/workflows/finalize-staged-source.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true

          test -f pyproject.toml
          test -f alpic.json
          test -f requirements.lock
          test -f src/nplg_mcp/app.py
          test -f scripts/verify_deploy.py
          test ! -e .bootstrap
          test ! -e .upload

      - name: Set up verified Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install and verify project
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pytest -q
          python -m compileall -q src scripts

      - name: Record verification marker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          Path('.alpic-source-ready.json').write_text(
              json.dumps(
                  {
                      'recovered_from_commit': os.environ['GITHUB_SHA'],
                      'verified_with_python': '3.13',
                      'checks': ['root-tree', 'install', 'pytest', 'compileall'],
                  },
                  indent=2,
                  sort_keys=True,
              ) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Atomically publish verified tree
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED="$(cat /tmp/expected-main-sha)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'Nothing to publish'; exit 1; }
          git commit -m 'fix: publish verified complete source tree'
          git push --force-with-lease="refs/heads/main:${EXPECTED}" origin HEAD:main
