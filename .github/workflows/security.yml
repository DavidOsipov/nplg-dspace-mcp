name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: nplg-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast:
    name: SAST and workflow analysis
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out the complete candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.15

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: python

      - name: Install hash-locked local gates
        run: |
          python -m pip install --require-hashes -r requirements-dev.lock
          npm ci --ignore-scripts

      - name: Run the typed local security battery
        run: python scripts/verify_release.py local-gates --worktree "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/nplg-security-sast" --node-executable "$(command -v node)" --compare-branch origin/main

      - name: Analyze with CodeQL
        uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: /language:python

      - name: Bind SAST evidence to its bytes
        if: always()
        run: |
          find "$RUNNER_TEMP/nplg-security-sast" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/nplg-security-sast.SHA256SUMS"
          test -s "$RUNNER_TEMP/nplg-security-sast.SHA256SUMS"

      - name: Upload SAST evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sast-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/nplg-security-sast
            ${{ runner.temp }}/nplg-security-sast.SHA256SUMS
          if-no-files-found: error
          retention-days: 30
          overwrite: false

  sca:
    name: Software composition analysis
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the complete candidate history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: 3.13.15

      - name: Set up pinned Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
