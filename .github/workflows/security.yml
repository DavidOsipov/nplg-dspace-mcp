      - name: Run the typed local SCA battery
        run: python scripts/verify_release.py local-gates --worktree "$GITHUB_WORKSPACE" --output "$RUNNER_TEMP/nplg-security-sca" --node-executable "$(command -v node)" --compare-branch origin/main

      - name: Bind SCA evidence to its bytes
        if: always()
        run: |
          find "$RUNNER_TEMP/nplg-security-sca" -type f -print0 | sort -z | xargs -0 sha256sum > "$RUNNER_TEMP/nplg-security-sca.SHA256SUMS"
          test -s "$RUNNER_TEMP/nplg-security-sca.SHA256SUMS"

      - name: Upload SCA evidence
        if: always()
