name: Diagnose source transfer

on:
  push:
    branches:
      - restore-python-source-20260814
    paths:
      - .source-transfer/DIAG

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out transfer branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check every archive chunk
        shell: bash
        run: |
          set +e
          cd .source-transfer
          echo '=== per-part SHA-256 ==='
          sha256sum -c PARTS.sha256
          part_status=$?
          echo '=== reconstructed archive SHA-256 ==='
          cat part-*.b64 | base64 --decode > /tmp/nplg-source.tar.xz
          actual="$(sha256sum /tmp/nplg-source.tar.xz | awk '{print $1}')"
          expected="$(cat archive.sha256)"
          echo "expected=$expected"
          echo "actual=$actual"
          test "$part_status" -eq 0
          test "$actual" = "$expected"
