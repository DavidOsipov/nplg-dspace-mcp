name: Publish staged source

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-staged-source.yml'

permissions:
  contents: write

concurrency:
  group: publish-staged-source
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out staged repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reassemble and safely extract source payload
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t PARTS < <(find . -type f -name 'part-*.b64' -print | sort -V)
          if [ "${#PARTS[@]}" -eq 0 ]; then
            echo 'No staged part-*.b64 files found' >&2
            exit 1
          fi

          : > /tmp/source-payload
          for part in "${PARTS[@]}"; do
            tr -d '\r\n' < "$part" | base64 --decode >> /tmp/source-payload
          done

          rm -rf /tmp/source-unpacked
          mkdir -p /tmp/source-unpacked
          python3 - <<'PY'
          from __future__ import annotations

          import shutil
          import subprocess
          import tarfile
          import zipfile
          from pathlib import Path

          payload = Path('/tmp/source-payload')
          destination = Path('/tmp/source-unpacked').resolve()

          def safe_target(name: str) -> Path:
              target = (destination / name).resolve()
              if target != destination and destination not in target.parents:
                  raise RuntimeError(f'Archive path escapes destination: {name!r}')
              return target

          if zipfile.is_zipfile(payload):
              with zipfile.ZipFile(payload) as archive:
                  for member in archive.infolist():
                      safe_target(member.filename)
                  archive.extractall(destination)
          elif tarfile.is_tarfile(payload):
              with tarfile.open(payload, mode='r:*') as archive:
                  for member in archive.getmembers():
                      safe_target(member.name)
                      if member.issym() or member.islnk():
                          raise RuntimeError(f'Links are not permitted in staged source: {member.name!r}')
                  archive.extractall(destination, filter='data')
          else:
              verification = subprocess.run(
                  ['git', 'bundle', 'verify', str(payload)],
                  stdout=subprocess.PIPE,
                  stderr=subprocess.STDOUT,
                  text=True,
              )
              if verification.returncode != 0:
                  raise RuntimeError('Staged payload is neither ZIP, TAR, nor a valid Git bundle')
              repository = destination / 'bundle-repository'
              subprocess.run(['git', 'clone', str(payload), str(repository)], check=True)

          candidates = sorted(destination.rglob('pyproject.toml'))
          candidates = [path for path in candidates if '.git' not in path.parts]
          if len(candidates) != 1:
              raise RuntimeError(f'Expected exactly one pyproject.toml, found {len(candidates)}')
          root = candidates[0].parent
          for required in ('alpic.json', 'requirements.lock', 'src/nplg_mcp/app.py'):
              if not (root / required).is_file():
                  raise RuntimeError(f'Missing required source file: {required}')
          Path('/tmp/source-root').write_text(str(root), encoding='utf-8')
          PY

      - name: Replace staging tree with complete project
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ROOT="$(cat /tmp/source-root)"
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf -- {} +
          cp -a "$SOURCE_ROOT"/. .
          test -f pyproject.toml
          test -f alpic.json
          test -f requirements.lock
          test -f src/nplg_mcp/app.py
          test ! -e .bootstrap
          test ! -e .upload

      - name: Set up verified Python runtime
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install and test complete source tree
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[test]'
          python -m pytest -q
          python -m compileall -q src scripts

      - name: Publish complete source tree to main
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && { echo 'No source-tree changes to publish'; exit 1; }
          git commit -m 'fix: publish complete Alpic source tree'
          git push origin HEAD:main
